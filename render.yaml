# Blueprint Render pour l'API Nour Tech (backend/) — offre gratuite.
# Les données et les images envoyées depuis l'admin sont stockées dans PostgreSQL (Neon, gratuit) :
# renseigner DATABASE_URL avec la chaîne de connexion Neon.
# Le service gratuit s'endort après 15 min sans visite (premier chargement ensuite ~1 min).
services:
  - type: web
    name: nourtech-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/test
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
