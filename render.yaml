# Blueprint Render pour l'API Nour Tech (backend/)
# Le disque persistant garde la base SQLite et les images envoyées depuis l'admin.
# Il nécessite une offre payante (Starter) ; sans lui, tout est effacé à chaque redéploiement.
services:
  - type: web
    name: nourtech-api
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/test
    disk:
      name: nourtech-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
